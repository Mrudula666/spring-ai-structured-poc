spring.application.name=spring-ai-structured-poc

# Set these as environment variables. Never commit your API key.
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
# A current Claude model name from your Anthropic console, e.g. set ANTHROPIC_MODEL before running
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL}
# Same question -> same answer. Extraction is not a creative task.
spring.ai.anthropic.chat.options.temperature=0
spring.ai.anthropic.chat.options.max-tokens=500
